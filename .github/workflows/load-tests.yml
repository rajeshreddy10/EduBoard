name: 7. Load & Concurrency Stress Testing

on:
  schedule:
    - cron: '0 3 1,15 * *' # Twice a month
  workflow_dispatch:
    inputs:
      concurrent_users:
        description: 'Number of concurrent users (100, 500, or 1000)'
        required: false
        default: '100'
      spawn_rate:
        description: 'User spawn rate per second'
        required: false
        default: '10'
      duration:
        description: 'Run duration (e.g., 60s, 2m)'
        required: false
        default: '60s'

permissions:
  contents: read

jobs:
  locust-load-testing:
    name: Scalability & Stress Benchmark
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Setup Node.js (for local server mock)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Load Testing Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install locust requests

      - name: Build Web Application
        run: |
          npm ci || npm install
          npm run build:web

      - name: Launch Local High-Throughput Test Server
        run: |
          npx serve -s apps/web/out -l 8080 &
          sleep 4

      - name: Execute Locust Load Test
        env:
          USERS: ${{ github.event.inputs.concurrent_users || '100' }}
          SPAWN_RATE: ${{ github.event.inputs.spawn_rate || '10' }}
          DURATION: ${{ github.event.inputs.duration || '60s' }}
        run: |
          echo "Starting Locust with $USERS concurrent users, spawn rate $SPAWN_RATE/s for $DURATION..."
          locust -f tests/load/test_load.py \
            --headless \
            --users $USERS \
            --spawn-rate $SPAWN_RATE \
            --run-time $DURATION \
            --host http://localhost:8080 \
            --html load-test-report.html \
            --csv load-test-metrics

      - name: Upload Load Testing Metrics
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: locust-load-report
          path: |
            load-test-report.html
            load-test-metrics*.csv
          if-no-files-found: ignore

      - name: Publish Load Test Summary
        if: always()
        run: |
          echo "## Load Testing & Concurrency Benchmark Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Target Test Server**: http://localhost:8080" >> $GITHUB_STEP_SUMMARY
          echo "- **Target Users**: ${{ github.event.inputs.concurrent_users || '100' }} concurrent users" >> $GITHUB_STEP_SUMMARY
          echo "- **Stress Profiles**: Concurrent stroke ingestion, document buffer writes, state sync" >> $GITHUB_STEP_SUMMARY
