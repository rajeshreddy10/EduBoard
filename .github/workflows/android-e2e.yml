name: Android Appium E2E & GitHub Pages Report Hosting

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: android-e2e-${{ github.ref }}
  cancel-in-progress: false

jobs:
  appium-e2e:
    name: Appium Android E2E Execution & Reporting
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 2. Setup Java 17 Environment
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Setup Python 3.11 Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 4. Setup Node.js (v20) Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 5. Install Appium & Reporting Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tests/appium/requirements.txt
          npm install -g appium
          appium driver install uiautomator2 || true

      - name: 6. Setup Android APK Artifact
        run: |
          mkdir -p tests/appium/apk
          if [ ! -f "tests/appium/apk/eduboard_debug.apk" ]; then
            echo "Mock APK initialized for headless CI test harness" > tests/appium/apk/eduboard_debug.apk
          fi

      - name: 7. Start Appium Server
        run: |
          appium --log tests/appium/appium_server.log --log-level info:debug --port 4723 &
          sleep 5

      - name: 8. Execute Appium E2E 355 Test Suite
        env:
          APPIUM_SERVER: "http://localhost:4723"
          APK_PATH: "tests/appium/apk/eduboard_debug.apk"
        run: |
          pytest tests/appium/test_appium.py -v --tb=short

      - name: 9. Generate Multi-Format Test Reports (Excel, HTML, Summary)
        if: always()
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python tests/appium/generate_reports.py

      - name: 10. Upload Test Artifacts (Excel, HTML, Screenshots, Logs, Summary)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Appium-Test-Results-Build-${{ github.run_number }}
          path: |
            Test Results/
            reports/
          if-no-files-found: warn
          retention-days: 30

      - name: 11. Publish HTML Reports to GitHub Pages
        if: always() && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./reports
          destination_dir: reports
          keep_files: true

      - name: 12. Display GitHub Actions Step Summary
        if: always()
        run: |
          if [ -f "Test Results/Summary/summary.md" ]; then
            cat "Test Results/Summary/summary.md" >> $GITHUB_STEP_SUMMARY
          else
            echo "# Android Appium Test Summary" >> $GITHUB_STEP_SUMMARY
            echo "Build Number: ${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
            echo "Execution Date: $(date -u)" >> $GITHUB_STEP_SUMMARY
            echo "Report URL: https://${{ github.repository_owner }}.github.io/EduBoard/reports/latest/execution-report.html" >> $GITHUB_STEP_SUMMARY
          fi
