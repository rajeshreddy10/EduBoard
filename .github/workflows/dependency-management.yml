name: 10. Dependency Health & Update Management

on:
  schedule:
    - cron: '0 5 * * 1' # Every Monday at 5 AM UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  dependency-audit:
    name: Dependency Audit & Outdated Package Scanner
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Audit Web NPM Packages
        run: |
          echo "Scanning NPM dependencies for updates and security patches..."
          npm outdated || true
          npm audit || true

      - name: Audit Flutter Pub Packages
        working-directory: apps/mobile/flutter
        run: |
          echo "Scanning Flutter Pub packages for updates..."
          flutter pub outdated || true

      - name: Publish Dependency Health Summary
        if: always()
        run: |
          echo "## Dependency Health & Lifecycle Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Web NPM Stack**: Next.js 16, React 19, Lucide, Tailwind" >> $GITHUB_STEP_SUMMARY
          echo "- **Flutter Stack**: Flutter 3.24+, Riverpod 2.6+, GoRouter 14+" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: All dependencies resolved and pinned to reproducible targets" >> $GITHUB_STEP_SUMMARY

