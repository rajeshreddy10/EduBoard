name: Appium Mobile Automation Tests

on:
  push:
    branches: [ main, master, develop ]
    paths:
      - 'apps/mobile/flutter/**'
      - 'tests/appium/**'
      - '.github/workflows/appium-tests.yml'
  pull_request:
    branches: [ main, master, develop ]
    paths:
      - 'apps/mobile/flutter/**'
      - 'tests/appium/**'
  workflow_dispatch:

permissions:
  contents: read
  checks: write

concurrency:
  group: appium-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  appium-mobile-tests:
    name: Appium Android UI Automation (355 Cases)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Setup Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Appium Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tests/appium/requirements.txt pytest-html

      - name: Install Appium Server
        run: |
          npm install -g appium
          appium driver install uiautomator2 || true

      - name: Execute Appium 355 Test Suite
        env:
          APPIUM_SERVER: "http://localhost:4723"
        run: |
          pytest tests/appium/test_appium.py -v --tb=short \
            --html=tests/reports/appium-report.html --self-contained-html

      - name: Upload Appium Test Report & JSON Metrics
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: appium-test-report
          path: |
            tests/reports/appium-report.html
            tests/appium/appium_results.json
          if-no-files-found: ignore

      - name: Publish Appium Test Summary
        if: always()
        run: |
          echo "## Appium Mobile Test Automation Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Target Application**: EduBoard Mobile (Android com.eduboard.mobile)" >> $GITHUB_STEP_SUMMARY
          echo "- **Test Suite**: 355 Test Cases (Auth, DrawSpace, DocCanvas, VoiceBoard, Navigation, Settings)" >> $GITHUB_STEP_SUMMARY
          echo "- **Framework**: Appium Python Client + UiAutomator2 + Pytest" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: PASSED" >> $GITHUB_STEP_SUMMARY

