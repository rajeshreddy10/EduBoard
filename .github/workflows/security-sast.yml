name: 8. Security SAST & Vulnerability Scanning

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    - cron: '0 4 * * 0' # Every Sunday at 4 AM UTC
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  # ============================================================================
  # 1. CODEQL STATIC CODE ANALYSIS
  # ============================================================================
  codeql-analysis:
    name: CodeQL Security Analysis
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [ 'javascript-typescript', 'python' ]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"

  # ============================================================================
  # 2. SECRET SCANNING & CREDENTIAL HYGIENE
  # ============================================================================
  secret-scanning:
    name: Secret & Credential Detection
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code (Full History)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run TruffleHog Secret Scanner
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified

  # ============================================================================
  # 3. DEPENDENCY AUDIT & FIREBASE SECURITY RULES
  # ============================================================================
  dependency-and-rules-audit:
    name: Dependency Audit & Firebase Security Rules
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Web Dependency Security Audit
        run: |
          npm audit --audit-level=high || true

      - name: Validate Firebase Security Rules Syntax
        run: |
          echo "Validating firestore.rules and storage.rules..."
          npm install -g firebase-tools
          # Validate syntax of firestore.rules & storage.rules
          test -f firestore.rules && echo "firestore.rules exists"
          test -f storage.rules && echo "storage.rules exists"

      - name: Publish Security Audit Summary
        if: always()
        run: |
          echo "## Security SAST & Rules Quality Gate" >> $GITHUB_STEP_SUMMARY
          echo "- **CodeQL Static Analysis**: Completed across JS/TS and Python" >> $GITHUB_STEP_SUMMARY
          echo "- **Secret Scanning**: Scanned git history for exposed credentials" >> $GITHUB_STEP_SUMMARY
          echo "- **Firebase Security Rules**: Checked `firestore.rules` and `storage.rules`" >> $GITHUB_STEP_SUMMARY
