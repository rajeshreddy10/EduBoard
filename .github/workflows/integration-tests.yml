name: 3. Integration Testing

on:
  push:
    branches: [ main, master, develop ]
    paths:
      - 'tests/integration/**'
      - 'apps/web/**'
      - 'apps/mobile/flutter/**'
      - '.github/workflows/integration-tests.yml'
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

permissions:
  contents: read
  checks: write

concurrency:
  group: integration-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration-tests:
    name: Firebase & Web-Mobile Sync Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Integration Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio pytest-html requests

      - name: Execute Firebase Sync & CRUD Integration Tests
        run: |
          pytest tests/integration/test_sync_integration.py -v --tb=short --html=integration-report.html --self-contained-html

      - name: Upload Integration Test Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-test-report
          path: integration-report.html
          if-no-files-found: ignore

      - name: Publish Integration Summary
        if: always()
        run: |
          echo "## Firebase & Cross-Platform Sync Integration Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Authentication Contract**: Verified" >> $GITHUB_STEP_SUMMARY
          echo "- **Firestore CRUD Operations**: Verified" >> $GITHUB_STEP_SUMMARY
          echo "- **Web & Mobile Sync Protocol**: Verified" >> $GITHUB_STEP_SUMMARY
