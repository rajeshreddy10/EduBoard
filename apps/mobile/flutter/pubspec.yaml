name: eduboard_mobile
description: "EduBoard Mobile Application — Flutter Web Container with Shared Backend & Database"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  webview_flutter: ^4.10.0
  permission_handler: ^11.3.1
  speech_to_text: ^7.3.0
  url_launcher: ^6.3.1
  http: ^1.2.2
  firebase_core: ^3.8.0
  firebase_auth: ^5.3.3
  cloud_firestore: ^5.5.0
  firebase_storage: ^12.3.6
  google_sign_in: ^6.2.2
  socket_io_client: ^3.0.2
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  google_fonts: ^9.0.0
  intl: ^0.20.3
  file_picker: ^13.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
